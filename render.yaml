services:
  - type: web
    name: company-accounting
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    disk:
      name: database
      mountPath: /data
      sizeGB: 1

  - type: cron
    name: daily-report
    env: python
    schedule: "0 18 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python daily_report.py