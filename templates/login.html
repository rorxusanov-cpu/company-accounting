<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | Company Accounting</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #0a0f1e;
            --ink2: #1e2a45;
            --accent: #3b6ef6;
            --accent2: #00d4aa;
            --glass: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.10);
            --error: #ff4d6d;
        }

        body {
            min-height: 100vh;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }

        /* Animated background */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: drift 12s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #3b6ef6, transparent);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00d4aa, transparent);
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }

        .blob-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* Grid lines */
        .grid-lines {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* Card */
        .card {
            position: relative;
            z-index: 10;
            width: 420px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        .logo-text span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,0.45);
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 32px;
        }

        /* Error */
        .error-box {
            background: rgba(255,77,109,0.12);
            border: 1px solid rgba(255,77,109,0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--error);
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%       { transform: translateX(-6px); }
            75%       { transform: translateX(6px); }
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, background 0.2s;
            outline: none;
        }

        input::placeholder { color: rgba(255,255,255,0.2); }

        input:focus {
            border-color: var(--accent);
            background: rgba(59,110,246,0.08);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent), #5b21b6);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
            letter-spacing: 0.02em;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(59,110,246,0.4);
        }

        .btn:hover::after { background: rgba(255,255,255,0.06); }
        .btn:active { transform: translateY(0); }

        /* Footer */
        .card-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: rgba(255,255,255,0.35);
        }

        .card-footer a {
            color: var(--accent2);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .card-footer a:hover { opacity: 0.75; }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }

        @media (max-width: 480px) {
            .card { width: 92vw; padding: 36px 24px; }
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>
<div class="grid-lines"></div>

<div class="card">

    <div class="logo-wrap">
        <div class="logo-icon">🏢</div>
        <div class="logo-text">
            Company Accounting
            <span>Moliyaviy nazorat tizimi</span>
        </div>
    </div>

    <h1>Xush kelibsiz</h1>
    <p class="subtitle">Hisobingizga kirish uchun ma'lumotlaringizni kiriting</p>

    {% if error %}
    <div class="error-box">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Login</label>
            <input type="text" name="username" placeholder="Foydalanuvchi nomingiz" required autofocus>
        </div>

        <div class="form-group">
            <label>Parol</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn">Kirish →</button>
    </form>

    <div class="divider"><span>yoki</span></div>

    <div class="card-footer">
        Hisobingiz yo'qmi?
        <a href="{{ url_for('signup') }}">Ro'yxatdan o'ting</a>
    </div>

</div>

</body>
</html>
