<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish | Company Accounting</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #0a0f1e;
            --accent: #3b6ef6;
            --accent2: #00d4aa;
            --border: rgba(255,255,255,0.10);
            --error: #ff4d6d;
            --success: #00d4aa;
        }

        body {
            min-height: 100vh;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: drift 12s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #00d4aa, transparent);
            top: -80px; right: -80px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 380px; height: 380px;
            background: radial-gradient(circle, #3b6ef6, transparent);
            bottom: -60px; left: -60px;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 280px; height: 280px;
            background: radial-gradient(circle, #f59e0b, transparent);
            top: 40%; right: 20%;
            animation-delay: -9s;
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 25px) scale(1.08); }
        }

        .grid-lines {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 420px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        .logo-text span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,0.45);
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 32px;
        }

        /* Password strength */
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.08);
            margin-top: 8px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 5px;
        }

        /* Rules */
        .rules {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rule {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .rule.ok { color: var(--success); }

        .rule-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .rule.ok .rule-dot { background: var(--success); }

        /* Error */
        .error-box {
            background: rgba(255,77,109,0.12);
            border: 1px solid rgba(255,77,109,0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--error);
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%       { transform: translateX(-6px); }
            75%       { transform: translateX(6px); }
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, background 0.2s;
            outline: none;
        }

        input::placeholder { color: rgba(255,255,255,0.2); }

        input:focus {
            border-color: var(--accent2);
            background: rgba(0,212,170,0.06);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
            letter-spacing: 0.02em;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(0,212,170,0.35);
        }

        .btn:active { transform: translateY(0); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span { font-size: 12px; color: rgba(255,255,255,0.25); }

        .card-footer {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.35);
        }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .card-footer a:hover { opacity: 0.75; }

        @media (max-width: 480px) {
            .card { width: 92vw; padding: 36px 24px; }
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>
<div class="grid-lines"></div>

<div class="card">

    <div class="logo-wrap">
        <div class="logo-icon">🏢</div>
        <div class="logo-text">
            Company Accounting
            <span>Moliyaviy nazorat tizimi</span>
        </div>
    </div>

    <h1>Hisob yaratish</h1>
    <p class="subtitle">Direktor sifatida ro'yxatdan o'ting</p>

    {% if error %}
    <div class="error-box">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('signup') }}">
        <div class="form-group">
            <label>Login</label>
            <input type="text" name="username" id="username"
                   placeholder="Foydalanuvchi nomingiz" required autofocus>
        </div>

        <div class="form-group">
            <label>Parol</label>
            <input type="password" name="password" id="password"
                   placeholder="Kamida 6 ta belgi" required>
            <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>
            <div class="rules">
                <div class="rule" id="rule-len">
                    <div class="rule-dot"></div> Kamida 6 ta belgi
                </div>
                <div class="rule" id="rule-num">
                    <div class="rule-dot"></div> Raqam mavjud
                </div>
            </div>
        </div>

        <button type="submit" class="btn">Ro'yxatdan o'tish →</button>
    </form>

    <div class="divider"><span>yoki</span></div>

    <div class="card-footer">
        Hisobingiz bormi?
        <a href="{{ url_for('login') }}">Kirish</a>
    </div>

</div>

<script>
const pwd = document.getElementById('password');
const fill = document.getElementById('strengthFill');
const text = document.getElementById('strengthText');
const ruleLen = document.getElementById('rule-len');
const ruleNum = document.getElementById('rule-num');

pwd.addEventListener('input', function () {
    const val = this.value;
    const hasLen = val.length >= 6;
    const hasNum = /\d/.test(val);

    ruleLen.classList.toggle('ok', hasLen);
    ruleNum.classList.toggle('ok', hasNum);

    let score = 0;
    if (hasLen) score++;
    if (hasNum) score++;
    if (val.length >= 10) score++;
    if (/[!@#$%^&*]/.test(val)) score++;

    const levels = [
        { w: '0%',   bg: 'transparent', label: '' },
        { w: '30%',  bg: '#ef4444',     label: 'Zaif' },
        { w: '55%',  bg: '#f59e0b',     label: "O'rtacha" },
        { w: '80%',  bg: '#3b82f6',     label: 'Yaxshi' },
        { w: '100%', bg: '#00d4aa',     label: 'Kuchli 💪' },
    ];

    const l = levels[score] || levels[0];
    fill.style.width = l.w;
    fill.style.background = l.bg;
    text.textContent = l.label;
    text.style.color = l.bg;
});
</script>

</body>
</html>
